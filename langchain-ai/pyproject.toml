[project]
name = "langchain-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langchain-deepseek>=1.1.0",
    "python-dotenv>=1.2.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[project.scripts]
dev = "app.main:start"

[tool.ruff]
line-length = 180

[tool.ruff.format]
quote-style = "double"
