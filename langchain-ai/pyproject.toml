[project]
name = "langchain-ai"
version = "0.1.0"
description = "ai agent application base on langchain"
readme = "README.md"
authors = [
    { name = "aiden", email = "aidenpeng0504@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.17",
    "langchain-deepseek>=1.1.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
dev = "app.main:run"

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
