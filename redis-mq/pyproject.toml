[project]
name = "redis-mq"
version = "0.1.0"
description = "learn redis and kafka message queue"
readme = "README.md"
authors = [
    { name = "aiden", email = "aidenpeng0504@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dev = "app.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
