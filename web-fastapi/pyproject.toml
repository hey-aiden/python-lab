[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-fastapi"
version = "0.1.0"
description = "web development - fastapi framework deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.140.13",
    "pydantic-settings>=2.0.0",
    "pymysql>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
]

[project.scripts]
dev = "app.main:start"
run = "app.main:run"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",     # Pyflakes — 未使用的 import、未定义变量等
    "I",     # isort — import 顺序
    "SIM",   # flake8-simplify — 可简化的写法
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"    # 统一用双引号

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
