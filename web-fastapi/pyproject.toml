[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-fastapi"
version = "0.1.0"
description = "web development - fastapi framework deploy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.13",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
dev = "app.main:start"
run = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
